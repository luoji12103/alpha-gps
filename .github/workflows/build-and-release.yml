name: Verify Android

on:
  push:
    branches: [main]
    tags: ['v*+power.*']
    paths-ignore: ['website/**', '**/*.md']
  pull_request:
    paths-ignore: ['website/**', '**/*.md']
  workflow_dispatch:

# Unsigned CI builds must never become installable releases.
# The persistent signing key stays with the maintainer, outside this repository.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release-metadata.py --check-tag "$GITHUB_REF_NAME"
          else
            python3 scripts/release-metadata.py
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Tests, release build and lint
        run: >-
          ./gradlew -PdisableSentryUpload=true -PtargetAbi=arm64-v8a --max-workers=2
          :sharednew:testAndroidHostTest :app:testFossDebugUnitTest
          :app:assembleFossRelease :app:lintFossRelease :app:compileGplayDebugKotlin
